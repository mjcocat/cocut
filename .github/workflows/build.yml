name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build macOS app
    runs-on: macos-26
    timeout-minutes: 30
    env:
      HAS_CERT: ${{ secrets.COCUT_CERT_P12 != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          XCODE="$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Install tools
        run: brew install xcodegen xcbeautify

      - name: Work out version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(grep -m1 'MARKETING_VERSION' project.yml | sed -E 's/.*"([^"]+)".*/\1/')"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Building Cocut $VERSION (build ${{ github.run_number }})"

      - name: Generate Xcode project
        run: xcodegen

      - name: Build (Release, universal)
        run: |
          set -o pipefail
          xcodebuild \
            -project Cocut.xcodeproj \
            -scheme Cocut \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build \
            ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            CODE_SIGNING_ALLOWED=NO \
            build | xcbeautify --renderer github-actions

      - name: Build Cocut Lab (Release, universal)
        run: |
          set -o pipefail
          xcodebuild \
            -project Cocut.xcodeproj \
            -scheme CocutLab \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build \
            ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            CODE_SIGNING_ALLOWED=NO \
            build | xcbeautify --renderer github-actions

      - name: Check the player model is in the app
        run: |
          APP="build/Build/Products/Release/Cocut.app"
          test -d "$APP/Contents/Resources/PersonReID.mlmodelc" || { echo "::error::PersonReID.mlmodelc missing from the app"; ls "$APP/Contents/Resources"; exit 1; }

      - name: Import signing certificate
        if: env.HAS_CERT == 'true'
        env:
          CERT_P12: ${{ secrets.COCUT_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.COCUT_CERT_PASSWORD }}
        run: |
          KC="$RUNNER_TEMP/signing.keychain-db"
          KC_PW="$(openssl rand -hex 12)"
          security create-keychain -p "$KC_PW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KC_PW" "$KC"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PW" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          HASH="$(security find-certificate -c "Cocut Self-Signed" -Z "$KC" | awk '/SHA-1/ {print $NF}')"
          echo "SIGN_IDENTITY=$HASH" >> "$GITHUB_ENV"
          rm "$RUNNER_TEMP/cert.p12"

      - name: Sign
        run: |
          APP="build/Build/Products/Release/Cocut.app"
          IDENTITY="${SIGN_IDENTITY:--}"
          [[ "$IDENTITY" == "-" ]] && echo "::notice::No COCUT_CERT_P12 secret; signing ad-hoc. Run scripts/setup-signing.sh once to keep Screen Recording permission across updates."
          codesign --force --options runtime --timestamp=none \
            --entitlements Cocut/Cocut.entitlements \
            --sign "$IDENTITY" "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dr - "$APP"
          LAB="build/Build/Products/Release/Cocut Lab.app"
          codesign --force --options runtime --timestamp=none --sign "$IDENTITY" "$LAB"
          codesign --verify --deep --strict --verbose=2 "$LAB"
          # The command line works from the app's executable.
          "$LAB/Contents/MacOS/Cocut Lab" help | head -3

      - name: Package
        run: |
          ditto -c -k --sequesterRsrc --keepParent "build/Build/Products/Release/Cocut.app" Cocut.zip
          echo "Built Cocut $VERSION: $(du -h Cocut.zip | cut -f1)"
          ditto -c -k --sequesterRsrc --keepParent "build/Build/Products/Release/Cocut Lab.app" CocutLab.zip
          echo "Built Cocut Lab $VERSION: $(du -h CocutLab.zip | cut -f1)"

      - uses: actions/upload-artifact@v4
        with:
          name: Cocut-${{ env.VERSION }}-${{ github.run_number }}
          path: |
            Cocut.zip
            CocutLab.zip
          retention-days: 30

      # A release is published whenever the version in project.yml has no release yet
      # (bump MARKETING_VERSION and push to main), or when a v* tag is pushed.
      - name: Decide whether to release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/heads/main" ]] \
               && ! gh release view "v$VERSION" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Publishing new release v$VERSION"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      - name: What's new in this version
        id: notes
        if: steps.release.outputs.publish == 'true'
        run: |
          # This version's section of CHANGELOG.md (the "## X.Y.Z" heading down to the next one).
          SECTION="$(awk -v v="$VERSION" '/^## /{ on = ($2 == v || $2 == "v" v) ; next } on' CHANGELOG.md | sed '/^[[:space:]]*$/d')"
          if [[ -z "$SECTION" ]]; then
            echo "::warning::CHANGELOG.md has no entry for $VERSION; the update window will have no What's New"
          fi
          {
            echo "whatsnew<<COCUT_EOF"
            if [[ -n "$SECTION" ]]; then
              echo "## What's new"
              echo
              echo "$SECTION"
              echo
            fi
            echo "COCUT_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Publish release
        if: steps.release.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: Cocut ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          files: |
            Cocut.zip
            CocutLab.zip
          generate_release_notes: true
          body: |
            ${{ steps.notes.outputs.whatsnew }}
            ## Installing Cocut

            **Already have Cocut?** It updates itself. Choose **Cocut › Check for Updates…**.

            **New Mac, easiest way.** Open **Terminal**, paste this line, and press Return:
            ```
            curl -fsSL https://raw.githubusercontent.com/mjcocat/cocut/main/scripts/install.sh | bash
            ```
            It downloads Cocut into Applications and opens it. Cocut's **Setup Guide** then walks you through the two permissions it needs.

            **New Mac, by hand.**
            1. Download **Cocut.zip** below, double-click it, and drag **Cocut** into **Applications**.
            2. Open Cocut. macOS says it can't verify the app, because Cocut isn't from the App Store. Click **Done**.
            3. Open **System Settings › Privacy & Security**, scroll down, click **Open Anyway** next to Cocut, and confirm.
            4. If the Dock icon just keeps bouncing, open Terminal and run `pkill -9 -x Cocut`, then open Cocut again.
            5. Follow the **Setup Guide** that opens: allow **Screen Recording** (then reopen Cocut) and **App Management** (for automatic updates).

            Requires macOS 26 or later.

  build-ios:
    name: Build iOS app (unsigned)
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          XCODE="$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Install tools
        run: brew install xcodegen xcbeautify

      - name: Generate Xcode project
        run: xcodegen

      # Compile check only: iOS installs need Apple-issued signing, done from Xcode for now.
      - name: Build (Debug, generic iOS device)
        run: |
          set -o pipefail
          xcodebuild \
            -project Cocut.xcodeproj \
            -scheme CocutiOS \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build | xcbeautify --renderer github-actions
